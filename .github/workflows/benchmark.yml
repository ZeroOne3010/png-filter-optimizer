name: PNG Corpus Benchmark

on:
  workflow_dispatch:
    inputs:
      corpus_path:
        description: "Path to PNG corpus directory in repository/workspace"
        required: true
        default: "src/test/resources/test-images/"
      diagnostics_mode:
        description: "Include diagnostic output in benchmark reports"
        required: false
        type: boolean
        default: true
      insights_verbose:
        description: "Include verbose compression insights in benchmark reports"
        required: false
        type: boolean
        default: true
      sticky_pr_comment:
        description: "Post sticky PR comment"
        required: false
        type: boolean
        default: false
      summary_filter_images:
        description: "Include filter visualization images in the job summary when not posting a PR comment"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 26 (Temurin) with Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Install zopfli
        run: |
          sudo apt-get update
          sudo apt-get install -y zopfli pigz

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Test
        run: ./gradlew --no-daemon test

      - name: JMH benchmarks
        run: |
          if [ -d src/jmh ] && find src/jmh -type f -name "*.java" -print -quit | grep -q .; then
            ./gradlew --no-daemon jmh
          else
            echo "No JMH benchmarks found under src/jmh; skipping jmh task."
          fi

      - name: Run PNG corpus benchmark
        run: |
          mkdir -p build/reports/pngfilteropt
          DIAG_FLAG=""
          if [ "${{ inputs.diagnostics_mode }}" = "true" ]; then
            DIAG_FLAG="--diagnostics"
          fi
          INSIGHTS_FLAG=""
          if [ "${{ inputs.insights_verbose }}" = "true" ]; then
            INSIGHTS_FLAG="--insights-verbose"
          fi
          VISUALIZATION_FLAGS="--no-filter-visualizations"
          if [ "${{ inputs.sticky_pr_comment }}" = "true" ]; then
            VISUALIZATION_FLAGS="--filter-visualizations --filter-visualization-max-side 512"
          elif [ "${{ inputs.summary_filter_images }}" = "true" ]; then
            VISUALIZATION_FLAGS="--filter-visualizations --filter-visualization-inline"
          fi
          ./gradlew --no-daemon run --args="benchmark ${{ inputs.corpus_path }} --try-all ${DIAG_FLAG} ${INSIGHTS_FLAG} --markdown build/reports/pngfilteropt/benchmark.md --json build/reports/pngfilteropt/benchmark.json ${VISUALIZATION_FLAGS}"

      - name: Resolve PR context for sticky comment
        id: pr_context
        if: ${{ inputs.sticky_pr_comment }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = `${owner}:${context.ref.replace('refs/heads/', '')}`;
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', head });
            const prNumber = prs.length > 0 ? String(prs[0].number) : '';
            core.info(prNumber ? `Resolved PR #${prNumber} for head ${head}` : `No open PR found for head ${head}`);
            core.setOutput('pr_number', prNumber);

      - name: Prepare PR comment image attachments
        if: ${{ inputs.sticky_pr_comment && steps.pr_context.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_SESSION_TOKEN: ${{ secrets.GH_SESSION_TOKEN }}
        run: |
          if [ -z "${GH_SESSION_TOKEN}" ]; then
            echo "GH_SESSION_TOKEN secret is required to upload GitHub comment attachments." >&2
            exit 1
          fi
          gh extension install drogers0/gh-image
          python3 .github/workflows/scripts/attach-benchmark-images.py \
            --markdown build/reports/pngfilteropt/benchmark.md \
            --base-dir build/reports/pngfilteropt \
            --repo "${{ github.repository }}"

      - name: Append benchmark summary
        run: cat build/reports/pngfilteropt/benchmark.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: png-corpus-benchmark-artifacts
          path: |
            build/reports/pngfilteropt/benchmark.md
            build/reports/pngfilteropt/benchmark.json
            build/reports/**
            build/test-results/**
            build/jmh-results/**
          if-no-files-found: warn

      - name: Sticky PR comment
        if: ${{ inputs.sticky_pr_comment && steps.pr_context.outputs.pr_number != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: png-corpus-benchmark
          number: ${{ steps.pr_context.outputs.pr_number }}
          path: build/reports/pngfilteropt/benchmark.md
